name: Build & Test CI

# D-2 (pre-M6h hardening audit): this used to trigger only on main/master/develop, so every
# feature branch — including the one that added this fix — ran no CI at all. `push`/`pull_request`
# with no `branches` filter runs on everything; the branch protection rule (if any) belongs on
# the GitHub repo settings side, not here, so this file stays the single source of "does it build".
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Run Unit Tests
        run: ./gradlew check test --info

      # D-2: publish per-module JaCoCo reports so real coverage is visible, not just a pass/fail.
      - name: Generate coverage reports
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/build/reports/jacoco/test/'
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 30
